name: Bug report
description: Something isn't working — recording fails, transcript is wrong, summary never arrives, etc.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Yulu's native capture and Host run locally and depend on macOS permissions, the selected transcription engine, and any explicitly selected Summary or Conversation Provider. Please fill in the environment fields below and redact recordings, transcripts, tokens, and connector data.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the actual behavior.
      placeholder: e.g. "Started a Zoom meeting, the recording status panel showed up, but the resulting `audio.wav` is 0 bytes."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. "audio.wav should contain the system audio from Zoom plus my microphone."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal sequence to trigger the bug. If it only happens during specific meetings, say so.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`
      placeholder: "14.5"
    validations:
      required: true

  - type: input
    id: yulu-version
    attributes:
      label: Yulu version / commit
      description: Open Settings → About, or run `yulu version` from a development checkout.
      placeholder: "Yulu 0.23.0-rc.10"
    validations:
      required: true

  - type: dropdown
    id: install-path
    attributes:
      label: How did you install?
      options:
        - "Official GitHub Release DMG dragged into /Applications"
        - "Development checkout via `make dev-install`"
        - "Development checkout with customized config"
        - "Manual install without the supported installer"
        - "Other (describe below)"
    validations:
      required: true

  - type: dropdown
    id: audiodaemon
    attributes:
      label: Yulu.app code-signing identity
      description: Run `codesign -dv /Applications/Yulu.app 2>&1 | grep Authority` (or use the equivalent path in a dev checkout) and pick the first result.
      options:
        - "Developer ID Application"
        - "Apple Development"
        - "ad-hoc (`-`)"
        - "not signed / unknown"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste the last ~30 lines of whichever logs are relevant. Common ones:
        - `~/Library/Logs/Yulu/ui.log`
        - `~/Library/Logs/Yulu/audio_daemon.log`
        - `~/Library/Logs/Yulu/scheduler.log`
        - `~/Library/Logs/Yulu/status_agent.log`
        Redact any meeting titles or attendee names you don't want public.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Optional. Things that often matter:
        - Are you using BlackHole or a multi-output device? (Yulu is built to NOT need either.)
        - Which transcription, Summary, and Conversation Providers were explicitly selected, and what did their capability tests report?
        - What Host task ID/state is shown? For an Unknown Outcome, did you reconcile or abandon that exact action before retrying?
