name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel old runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Syntax + Swift build
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in install.sh \
                   yulu/scripts/setup.sh \
                   yulu/scripts/uninstall.sh \
                   yulu/scripts/yulu \
                   yulu/scripts/build_audio_daemon.sh; do
            printf 'bash -n %s\n' "$f"
            bash -n "$f"
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 --version
          for f in yulu/scripts/*.py; do
            printf 'py_compile %s\n' "$f"
            python3 -m py_compile "$f"
          done

      - name: Python unit tests
        run: |
          set -euo pipefail
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      - name: Doctor JSON smoke test
        run: |
          set -euo pipefail
          python3 yulu/scripts/doctor.py --json \
            --source-root "$PWD" \
            --runtime-root "$PWD" \
            --legacy-root "$PWD/.missing-legacy" \
            --config-dir "$PWD/.missing-config" \
            >/tmp/yulu-doctor.json || true
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/yulu-doctor.json'))
          assert data['source_git']['is_repo'] is True
          assert data['legacy_root_exists'] is False
          print('doctor JSON OK')
          PY

      - name: Version sanity
        run: |
          set -euo pipefail
          test -s VERSION
          python3 yulu/scripts/version.py --check
          python3 yulu/scripts/version.py --json

      - name: Swift build (audio_daemon, window_scanner, recorder_status)
        run: |
          set -euo pipefail
          swift --version
          mkdir -p .ci-build
          for f in yulu/scripts/audio_daemon.swift \
                   yulu/scripts/window_scanner.swift \
                   yulu/scripts/recorder_status.swift; do
            stem="$(basename "$f" .swift)"
            printf 'swiftc %s -> .ci-build/%s\n' "$f" "$stem"
            swiftc -o ".ci-build/$stem" "$f"
          done

      - name: Skill manifest sanity (skills/yulu/SKILL.md)
        run: |
          # vercel-labs/skills requires `name` + `description` in the frontmatter.
          # If we ever break the manifest, npx skills add will silently skip Yulu —
          # easier to catch in CI.
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path("skills/yulu/SKILL.md")
          assert p.exists(), "skills/yulu/SKILL.md is missing"
          text = p.read_text()
          m = re.match(r"^---\n(.*?)\n---", text, re.S)
          assert m, "skills/yulu/SKILL.md has no YAML frontmatter"
          fm = m.group(1)
          for key in ("name:", "description:"):
              assert key in fm, f"skills/yulu/SKILL.md frontmatter missing {key!r}"
          print("skills/yulu/SKILL.md frontmatter OK")
          PY

      - name: install.sh top-level guard
        run: |
          # Smoke-test: install.sh must exit cleanly when not on macOS / no clone target.
          # We just run `bash -n` already, but also verify the file opens with the
          # expected shebang and is executable.
          test -x install.sh
          head -1 install.sh | grep -q '^#!/usr/bin/env bash'
          echo "install.sh shebang + +x OK"

  yulu_ui:
    name: yulu_ui (typecheck + vitest + build)
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yulu/scripts/yulu_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yulu/scripts/yulu_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          test -s dist/server.js
          test -s dist/web/index.html
          test -d dist/web/assets
          ls -la dist/web/assets | head -10
          echo "yulu_ui build artifacts OK"
