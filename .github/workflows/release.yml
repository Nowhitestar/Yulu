name: Release

# Manual escape hatch: push a `v*.*.*` tag by hand (e.g. an urgent hotfix that
# can't wait for a Release PR) and this publishes it. The normal path is
# release-please.yml — you rarely need to touch this.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
