name: Release publish (reusable)

# Reusable publish pipeline shared by both release paths:
#   - release-please.yml (automatic, on Release PR merge)
#   - release.yml        (manual escape hatch, on `v*.*.*` tag push)
# It checks out the tag, re-runs the test suite, packages the assets, and
# creates/updates the GitHub Release with a notarized user-level runtime zip.
# package-pkg remains a local diagnostic target only: this repository does not
# currently hold a Developer ID Installer certificate, so unsigned pkg files
# must never be presented as production release assets.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish, e.g. v0.5.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release assets
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # release-please force-creates tags for draft releases, but the caller SHA
      # remains the stable source on both paths: the release merge commit for
      # automatic publishing and the tagged commit for the manual escape hatch.
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          EXPECTED="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag $TAG does not match VERSION $EXPECTED" >&2
            exit 1
          fi

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in install.sh \
                   packaging/scripts/package.sh \
                   packaging/scripts/package_pkg.sh \
                   packaging/scripts/pkg_postinstall.sh \
                   packaging/scripts/checksums.sh \
                   packaging/scripts/check_macos_deployment_target.sh \
                   packaging/scripts/install_application_node_dependencies.sh \
                   packaging/scripts/prepare_application_runtime.sh \
                   packaging/scripts/sign_and_notarize.sh \
                   packaging/scripts/verify_application_runtime.sh \
                   yulu/scripts/setup.sh \
                   yulu/scripts/setup_deps.sh \
                   yulu/scripts/setup_audio.sh \
                   yulu/scripts/setup_daemons.sh \
                   yulu/scripts/setup_ui.sh \
                   yulu/scripts/lib/common.sh \
                   yulu/scripts/uninstall.sh \
                   yulu/scripts/yulu \
                   yulu/scripts/build_audio_daemon.sh \
                   yulu/scripts/build_status_agent.sh; do
            printf 'bash -n %s\n' "$f"
            bash -n "$f"
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 --version
          for f in yulu/scripts/*.py; do
            printf 'py_compile %s\n' "$f"
            python3 -m py_compile "$f"
          done
          python3 -m py_compile packaging/scripts/build_local_caption_runtime_pack.py
          python3 -m py_compile packaging/scripts/validate_runtime_archive.py
          python3 -m py_compile packaging/scripts/runtime_node_version.py

      - name: Python unit tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yulu-release-venv"
          . "$RUNNER_TEMP/yulu-release-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      - name: Read locked Application Runtime Node version
        id: application-runtime-node
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="$(python3 packaging/scripts/runtime_node_version.py packaging/runtime-lock.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.application-runtime-node.outputs.version }}
          cache: npm
          cache-dependency-path: yulu/scripts/yulu_ui/package-lock.json

      - name: Verify Application Runtime Node toolchain
        env:
          EXPECTED_NODE_VERSION: ${{ steps.application-runtime-node.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$EXPECTED_NODE_VERSION"

      - name: Node typecheck, tests, and build
        working-directory: yulu/scripts/yulu_ui
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/packaging/scripts/install_application_node_dependencies.sh" "$PWD"
          npm run typecheck
          npm test
          npm run build

      - name: Validate locked Application Runtime inputs
        run: |
          set -euo pipefail
          test -s packaging/runtime-lock.json
          test -s yulu/scripts/local_caption_runtime_pack.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("packaging/runtime-lock.json").read_text())
          assert lock["schema"] == 1
          for component in ("node", "python", "ffmpeg"):
              assert len(lock[component]["sha256"]) == 64
              assert lock[component].get("url", "").startswith("https://")
          assert lock["ffmpeg"]["url"].startswith("https://ffmpeg.org/releases/")
          native = lock["betterSqlite3"]
          package_lock = json.loads(
              Path("yulu/scripts/yulu_ui/package-lock.json").read_text()
          )
          locked_addon_version = package_lock["packages"]["node_modules/better-sqlite3"]["version"]
          assert native["version"] == locked_addon_version
          assert native["nodeAbi"] == "137"
          assert native["platform"] == "darwin"
          assert native["architecture"] == "arm64"
          expected_asset = (
              f"better-sqlite3-v{locked_addon_version}-node-v137-darwin-arm64.tar.gz"
          )
          assert native["url"] == (
              "https://github.com/WiseLibs/better-sqlite3/releases/download/"
              f"v{locked_addon_version}/{expected_asset}"
          )
          assert re.fullmatch(r"[0-9a-f]{64}", native["sha256"])
          assert re.fullmatch(r"[0-9a-f]{64}", native["binarySha256"])
          pack = json.loads(Path("yulu/scripts/local_caption_runtime_pack.json").read_text())
          assert pack["schema"] == 1
          assert pack["architecture"] == "arm64"
          assert pack["pythonAbi"] == "cp313"
          assert "{tag}" in pack["assetUrlTemplate"]
          assert all(len(wheel["sha256"]) == 64 for wheel in pack["wheels"])
          PY

      # Sign + notarize + staple BEFORE packaging (Pitfall 4 ordering): the .app
      # DIRECTORIES are stapled here so the ticket travels inside the zip that the
      # next step builds. sign_and_notarize.sh also runs build_*.sh (bottom-up
      # hardened-runtime signing), so the package step below uses --skip-build to
      # avoid re-running the build and overwriting the stapled bundles.
      # Secrets are passed by NAME only (D-08); the helper never echoes a value
      # and uses no `set -x`. The keychain it creates is torn down in the
      # always-run "Clean up signing keychain" step at the end of the job.
      - name: Sign and notarize bundles
        env:
          YULU_CODESIGN_IDENTITY: ${{ secrets.YULU_CODESIGN_IDENTITY }}
          YULU_CODESIGN_P12_BASE64: ${{ secrets.YULU_CODESIGN_P12_BASE64 }}
          P12_PWD: ${{ secrets.P12_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash packaging/scripts/sign_and_notarize.sh

      - name: Package release assets
        run: |
          set -euo pipefail
          # --skip-build: the bundles are already built, signed, notarized, and
          # stapled by the previous step. Re-running build_*.sh here would strip
          # the staple. --skip-build also skips check_clean_worktree, which is
          # correct: signing/stapling intentionally mutates the allowlisted
          # bundle bytes (Info.plist, Mach-O, _CodeSignature/CodeResources).
          make package TAG="$TAG" PACKAGE_ARGS=--skip-build
          make checksums
          test -f "dist/yulu-macos-arm64-$TAG.zip"
          test -f "dist/yulu-local-caption-runtime-macos-arm64-$TAG.zip"
          test -f "dist/install.sh"
          test -f "dist/checksums.txt"
          (cd dist && shasum -a 256 -c checksums.txt)
          PYTHONPATH=yulu/scripts python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          from release_installer import (
              extract_release_zip,
              validate_runtime_layout,
              verify_release_bundle_security,
              verify_runtime_manifest,
          )

          tag = os.environ["TAG"]
          archive = Path("dist") / f"yulu-macos-arm64-{tag}.zip"
          with tempfile.TemporaryDirectory() as temporary:
              runtime = extract_release_zip(archive, Path(temporary))
              validate_runtime_layout(runtime, tag)
              verify_release_bundle_security(runtime, require_staple=True)
              verify_runtime_manifest(runtime)
              subprocess.run(
                  [
                      "bash",
                      "packaging/scripts/check_macos_deployment_target.sh",
                      str(runtime / "yulu/scripts/Yulu.app/Contents/MacOS/yulu_app"),
                      str(runtime / "yulu/scripts/Yulu.app/Contents/Helpers/YuluCapture.app/Contents/MacOS/audio_daemon"),
                      str(runtime / "yulu/scripts/Yulu.app/Contents/MacOS/audio_daemon"),
                      str(runtime / "yulu/scripts/Yulu.app/Contents/MacOS/xai_keychain"),
                      str(runtime / "yulu/scripts/Yulu.app/Contents/MacOS/calendar_probe"),
                      str(runtime / "yulu/scripts/StatusAgent.app/Contents/MacOS/status_agent"),
                      str(runtime / "yulu/scripts/recorder_status"),
                      str(runtime / "yulu/scripts/meeting_prompt"),
                  ],
                  check=True,
              )
          PY
          bash packaging/scripts/verify_application_runtime.sh \
            "$PWD/yulu/scripts/Yulu.app"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          version = tag[1:]
          changelog = pathlib.Path("CHANGELOG.md")
          notes = pathlib.Path("dist/release-notes.md")

          text = changelog.read_text() if changelog.exists() else ""
          pattern = rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, text, re.M | re.S)
          if match:
              body = match.group(0).strip()
          else:
              body = f"Release {tag}"
          bridge = pathlib.Path("docs/release-notes") / f"{tag}.md"
          if bridge.is_file():
              body = f"{body}\n\n{bridge.read_text().strip()}"
          notes.write_text(body + "\n")
          print(notes)
          PY

      # upload-artifact@v4 artifacts are immutable, so the privileged publish
      # job receives exactly the bytes verified above and cannot replace them.
      - name: Upload immutable verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yulu-release-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            dist/yulu-macos-arm64-${{ inputs.tag }}.zip
            dist/yulu-local-caption-runtime-macos-arm64-${{ inputs.tag }}.zip
            dist/install.sh
            dist/checksums.txt
            dist/release-notes.md

      # Tear down the ephemeral signing keychain and remove the decoded cert/key,
      # ALWAYS — even if an earlier step failed — so the imported Developer ID
      # identity never lingers on a shared runner (D-08, Pattern 3, T-01-19).
      # Each line is `|| true` so cleanup never masks the real job result.
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/yulu-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc_key.p8" \
                "$RUNNER_TEMP"/*-notarize.zip 2>/dev/null || true

  publish:
    name: Attest and publish verified release assets
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download immutable verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yulu-release-${{ inputs.tag }}
          path: dist

      - name: Verify handed-off release assets
        run: |
          set -euo pipefail
          test -s dist/release-notes.md
          (cd dist && shasum -a 256 -c checksums.txt)

      # SLSA build-provenance attestation for the release zips (BUILD-04).
      # Only this narrow job can mint the OIDC token and publish attestations.
      - name: Attest release zip provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/yulu-macos-arm64-${{ inputs.tag }}.zip
            dist/yulu-local-caption-runtime-macos-arm64-${{ inputs.tag }}.zip

      - name: Upload verified assets to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "dist/yulu-macos-arm64-$TAG.zip"
            "dist/yulu-local-caption-runtime-macos-arm64-$TAG.zip"
            "dist/install.sh"
            "dist/checksums.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release-please creates a draft. Re-draft an existing release on a
            # manual rerun so clobbered assets are never partially public.
            EDIT_ARGS=(
              "$TAG"
              --title "$TAG"
              --notes-file "dist/release-notes.md"
              --draft
            )
            if [[ "$TAG" == *-* ]]; then
              EDIT_ARGS+=(--prerelease)
            else
              EDIT_ARGS+=(--prerelease=false)
            fi
            gh release edit "${EDIT_ARGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            CREATE_ARGS=(
              "$TAG"
              "${ASSETS[@]}"
              --title "$TAG"
              --notes-file "dist/release-notes.md"
              --draft
            )
            if [[ "$TAG" == *-* ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi

          # Refuse to publish until every required remote asset exists and has a
          # non-zero size. The release remains draft on any failure above/below.
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv' \
            > "$RUNNER_TEMP/release-assets.tsv"
          for asset in "${ASSETS[@]}"; do
            name="$(basename "$asset")"
            awk -F '\t' -v expected="$name" '
              $1 == expected && $2 + 0 > 0 { found = 1 }
              END { exit(found ? 0 : 1) }
            ' "$RUNNER_TEMP/release-assets.tsv" || {
              echo "Required uploaded asset is missing or empty: $name" >&2
              exit 1
            }
          done

          # Re-download the draft assets and compare the actual remote bytes,
          # not just their names/sizes, before making the release public.
          REMOTE_DIR="$RUNNER_TEMP/yulu-remote-release-assets"
          rm -rf "$REMOTE_DIR"
          mkdir -p "$REMOTE_DIR"
          for asset in "${ASSETS[@]}"; do
            name="$(basename "$asset")"
            gh release download "$TAG" --pattern "$name" --dir "$REMOTE_DIR"
            cmp "$asset" "$REMOTE_DIR/$name" || {
              echo "Uploaded release asset differs from the verified local bytes: $name" >&2
              exit 1
            }
          done

      - name: Publish completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH_ARGS=(
            "$TAG"
            --draft=false
          )
          if [[ "$TAG" == *-* ]]; then
            PUBLISH_ARGS+=(--prerelease)
          else
            PUBLISH_ARGS+=(--prerelease=false)
          fi
          gh release edit "${PUBLISH_ARGS[@]}"
